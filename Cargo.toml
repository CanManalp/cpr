[package]
name = "cpr"
version = "0.8.0"
edition = "2024"
description = "A better file copy tool for the command line"
license = "MIT"
authors = ["Can Manalp"]
repository = "https://github.com/canmanalp/cpr"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
globset = "0.4.18"
indicatif = "0.18.4"
rayon = "1.11.0"

[dev-dependencies]
tempfile = "3.27.0"
